<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5b1421">
<title>ふるさとの祭り2026 in いわき｜祭りの音をとどけよう！</title>
<style>
:root{--red:#8e2638;--gold:#ffc857;--cream:#fff4d9;--ink:#2e201d;--green:#2f8061}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#29151b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;color:#fff;touch-action:none}
#app{position:relative;width:100%;height:100%;max-width:720px;margin:auto;background:#20121b;overflow:hidden}canvas{display:block;width:100%;height:100%}
.screen{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,rgba(67,15,29,.94),rgba(25,16,27,.96))}.panel{width:min(100%,500px);padding:23px 20px;border:1px solid rgba(255,220,145,.35);border-radius:25px;background:rgba(76,28,37,.9);box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center}.logo{font-size:12px;font-weight:800;color:#ffdf91;letter-spacing:.08em}.panel h1{margin:8px 0 8px;font-size:clamp(29px,8vw,46px);line-height:1.08}.panel h1 span{display:block;color:var(--gold);font-size:.55em;margin-top:8px}.lead{font-size:14px;line-height:1.75;color:#fff5df;margin:11px auto 16px;max-width:390px}.how{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.how div{min-height:82px;padding:10px 5px;border-radius:14px;background:rgba(255,255,255,.08);font-size:11px;line-height:1.4}.how b{display:block;font-size:26px;margin-bottom:5px}.btn{width:100%;border:0;border-radius:16px;padding:15px;background:linear-gradient(135deg,#ffc857,#f09b37);color:#421823;font-size:17px;font-weight:900;box-shadow:0 8px 22px rgba(240,155,55,.3);cursor:pointer}.sub{margin-top:10px;background:rgba(255,255,255,.1);color:white;box-shadow:none;border:1px solid rgba(255,255,255,.2)}
#hud{position:absolute;z-index:3;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:none;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:linear-gradient(#251018cc,transparent);pointer-events:none}.hudbox{font-size:12px;font-weight:800;text-shadow:0 2px 3px #000}.hudbox b{display:block;font-size:19px;color:#ffda79}.hudbox.right{text-align:right}.time{width:62px;height:62px;border:3px solid #ffcf61;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:21px;background:#561d2ccc;box-shadow:0 0 20px rgba(255,199,87,.25)}
#power{position:absolute;z-index:3;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));height:15px;border:2px solid rgba(255,255,255,.6);border-radius:99px;overflow:hidden;background:#170d13;display:none;pointer-events:none}#power i{display:block;width:0;height:100%;background:linear-gradient(90deg,#f3a93a,#fff17b,#66e69b);transition:width .1s}.powerlabel{position:absolute;bottom:calc(34px + env(safe-area-inset-bottom));left:0;right:0;z-index:3;text-align:center;font-size:11px;font-weight:800;display:none;text-shadow:0 2px 3px #000;pointer-events:none}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0}.chip{padding:6px 9px;border-radius:999px;background:#fff0cf;color:#6e2633;font-size:11px;font-weight:800}.resultScore{font-size:48px;font-weight:900;color:var(--gold);line-height:1}.rank{font-size:21px;font-weight:900;margin:9px 0}.event{margin:14px 0;padding:12px;border-radius:14px;background:#fff4d9;color:#4d2426;text-align:left;font-size:12px;line-height:1.65}.event b{font-size:14px}.sharemsg{min-height:1.4em;color:#a5f0c6;font-size:12px;margin-top:8px}.hidden{display:none!important}
#flash{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;background:white}.flash{animation:flash .12s}@keyframes flash{50%{opacity:.24}}
</style>
</head>
<body><div id="app">
<canvas id="game"></canvas><div id="flash"></div>
<div id="hud"><div class="hudbox">祭りポイント<b id="score">0</b></div><div class="time" id="time">45</div><div class="hudbox right">つながり<b id="combo">×1</b></div></div>
<div class="powerlabel" id="powerLabel">祭りの熱気を集めよう！</div><div id="power"><i id="powerBar"></i></div>
<section id="start" class="screen"><div class="panel"><div class="logo">ふるさとの祭り2026 in いわき</div><h1>祭りの音を<br>とどけよう！<span>スマホ・シューティング</span></h1><p class="lead">夜空に現れる太鼓・扇・獅子・提灯をタップして、福島の民俗芸能の魅力を会場いっぱいに広げよう。</p><div class="how"><div><b>👆</b>絵柄を<br>タップ</div><div><b>🔥</b>連続命中で<br>得点アップ</div><div><b>🏮</b>提灯は<br>ボーナス</div></div><button class="btn" id="startBtn">ゲームスタート</button><p style="font-size:11px;color:#e6c9c7;line-height:1.5;margin-bottom:0">音は端末内で生成します。マナーモード等では聞こえない場合があります。</p></div></section>
<section id="result" class="screen hidden"><div class="panel"><div class="logo">ゲーム終了！</div><div class="resultScore"><span id="finalScore">0</span> pt</div><div class="rank" id="rank"></div><p class="lead" id="rankText"></p><div class="chips"><span class="chip">📅 11月7日 14時〜</span><span class="chip">📅 11月8日 10時〜</span><span class="chip">🎟️ 入場無料</span></div><div class="event"><b>いわき芸術文化交流館アリオス</b><br>セキショウ中劇場<br>県内各地の踊り、神楽、舞などが一挙に披露されます。</div><button class="btn" id="shareBtn">結果をシェアして誘う</button><button class="btn sub" id="retryBtn">もう一度遊ぶ</button><div class="sharemsg" id="shareMsg"></div></div></section>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,dpr,playing=false,score=0,time=45,combo=1,hits=0,power=0,last=0,spawn=0,objects=[],particles=[],stars=[],raf,timer;
const icons=[{e:'🥁',p:100,c:'#f0a43d',name:'太鼓'},{e:'🪭',p:120,c:'#e85e72',name:'扇'},{e:'🦁',p:180,c:'#ffc857',name:'獅子'},{e:'🏮',p:300,c:'#ffdd64',name:'提灯',bonus:true},{e:'🎭',p:150,c:'#8bd5c0',name:'舞'}];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth>720?720:innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,a:Math.random()}))}addEventListener('resize',resize);resize();
function bg(t){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#160d22');g.addColorStop(.55,'#45152c');g.addColorStop(1,'#d05a38');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);stars.forEach(s=>{ctx.globalAlpha=.35+s.a*.6;ctx.fillStyle='#fff5cf';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()});ctx.globalAlpha=1;ctx.fillStyle='#17101c';ctx.beginPath();ctx.moveTo(0,H*.83);for(let x=0;x<=W;x+=35)ctx.lineTo(x,H*.78-Math.random()*3);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='#f3bd54';for(let x=12;x<W;x+=44){ctx.fillRect(x,H*.805,3,12);ctx.beginPath();ctx.ellipse(x+1.5,H*.798,6,8,0,0,7);ctx.fill()}}
function spawnObj(){const data=icons[Math.random()<.1?3:Math.floor(Math.random()*icons.length)];let r=data.bonus?27:23+Math.random()*8;objects.push({x:r+Math.random()*(W-r*2),y:H+50,r,vy:-(70+Math.random()*70),vx:(Math.random()-.5)*35,life:0,data,phase:Math.random()*6})}
function drawObj(o,t){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(Math.sin(t*.003+o.phase)*.12);ctx.shadowColor=o.data.c;ctx.shadowBlur=o.data.bonus?28:14;ctx.fillStyle='rgba(255,246,218,.94)';ctx.beginPath();ctx.arc(0,0,o.r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.font=`${o.r*1.25}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.data.e,0,2);ctx.restore()}
function burst(x,y,c,txt){for(let i=0;i<16;i++){let a=Math.random()*Math.PI*2,s=50+Math.random()*120;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c})}particles.push({x,y,vy:-45,life:1,text:txt,c:'#fff3a0'})}
function update(dt,t){spawn+=dt;if(spawn>.52){spawn=0;spawnObj()}objects.forEach(o=>{o.life+=dt;o.y+=o.vy*dt;o.x+=o.vx*dt;if(o.x<o.r||o.x>W-o.r)o.vx*=-1});objects=objects.filter(o=>o.y>-70);particles.forEach(p=>{p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;p.vy=(p.vy||0)+70*dt;p.life-=dt*1.45});particles=particles.filter(p=>p.life>0)}
function drawParticles(){particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);if(p.text){ctx.fillStyle=p.c;ctx.font='900 18px sans-serif';ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y)}else{ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,5,5)}});ctx.globalAlpha=1}
function loop(t){let dt=Math.min((t-last)/1000,.033)||0;last=t;bg(t);if(playing)update(dt,t);objects.forEach(o=>drawObj(o,t));drawParticles();raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);
function hit(x,y){if(!playing)return;let best=-1;for(let i=objects.length-1;i>=0;i--){let o=objects[i],dx=x-o.x,dy=y-o.y;if(dx*dx+dy*dy<(o.r+12)*(o.r+12)){best=i;break}}if(best>=0){let o=objects.splice(best,1)[0];hits++;combo=Math.min(9,1+Math.floor(hits/5));let add=o.data.p*combo;score+=add;power=Math.min(100,power+(o.data.bonus?24:10));burst(o.x,o.y,o.data.c,'+'+add);tone(o.data.bonus?760:420+combo*35);document.getElementById('flash').classList.remove('flash');void document.getElementById('flash').offsetWidth;document.getElementById('flash').classList.add('flash');if(power>=100){score+=1000;power=0;for(let i=0;i<6;i++)setTimeout(()=>burst(Math.random()*W,120+Math.random()*H*.55,'#ffd45f','祭！'),i*80)}updateHUD()}else{hits=0;combo=1;updateHUD()}}
function point(e){let r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;hit(p.clientX-r.left,p.clientY-r.top)}canvas.addEventListener('pointerdown',point);
let audio;function tone(freq){try{audio=audio||new (AudioContext||webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.12)}catch(e){}}
function updateHUD(){scoreEl.textContent=score;comboEl.textContent='×'+combo;powerBar.style.width=power+'%'}
const scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),powerBar=document.getElementById('powerBar');
function startGame(){score=0;time=45;combo=1;hits=0;power=0;objects=[];particles=[];playing=true;last=performance.now();start.classList.add('hidden');result.classList.add('hidden');hud.style.display='grid';document.getElementById('power').style.display='block';document.getElementById('powerLabel').style.display='block';document.getElementById('time').textContent=time;updateHUD();clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('time').textContent=time;if(time<=0)endGame()},1000)}
function endGame(){playing=false;clearInterval(timer);hud.style.display='none';document.getElementById('power').style.display='none';document.getElementById('powerLabel').style.display='none';finalScore.textContent=score;let r,t;if(score>=12000){r='🏆 ふるさとの祭り名人';t='福島の民俗芸能を盛り上げる力は満点。次は会場で、本物の音と舞を体感しよう！'}else if(score>=6000){r='🏮 祭りの盛り上げ隊長';t='見事な腕前です。家族や友達を誘って、地域をつなぐ祭りを楽しもう！'}else{r='🥁 期待の祭り人';t='ここからがお祭りとの出会い。アリオスで多彩な踊り、神楽、舞を見つけよう！'}rank.textContent=r;rankText.textContent=t;setTimeout(()=>result.classList.remove('hidden'),400)}
async function shareResult(){let text=`「祭りの音をとどけよう！」で${score}ポイント獲得！ 11月7日・8日は、いわき芸術文化交流館アリオスの「ふるさとの祭り2026 in いわき」へ。入場無料、一緒に行かない？`;try{if(navigator.share)await navigator.share({title:'ふるさとの祭り2026 in いわき',text});else{await navigator.clipboard.writeText(text);shareMsg.textContent='招待メッセージをコピーしました！'}}catch(e){}}
startBtn.onclick=startGame;retryBtn.onclick=startGame;shareBtn.onclick=shareResult;
</script></body></html>
